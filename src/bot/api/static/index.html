<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{clinic_name}} Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e1e5ec;
    --accent: #0f766e; --accent-text: #ffffff; --bot: #f1f4f8; --user: #0f766e;
    --user-text: #ffffff; --warn-bg: #fff4e5; --warn-text: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --panel: #171c25; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a3140;
      --accent: #2dd4bf; --accent-text: #06231f; --bot: #1f2632; --user: #14b8a6;
      --user-text: #04201c; --warn-bg: #3a2a10; --warn-text: #ffd59a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text);
          border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .status { color: var(--muted); font-style: italic; }
  .staff { border: 1px solid var(--accent); }
  .staffbar { padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line);
              background: var(--bot); }
  .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; }
  .meta ol { margin: 2px 0 0; padding-left: 20px; }
  sup { font-size: 10px; color: var(--accent); font-weight: 600; margin-left: 1px; cursor: help; }
  .note { margin-top: 8px; padding: 6px 9px; border-radius: 8px; font-size: 13px;
          background: var(--warn-bg); color: var(--warn-text); white-space: normal; }
  .fb { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .fb button { border: 1px solid var(--line); background: var(--panel); color: var(--text);
               border-radius: 8px; padding: 2px 8px; cursor: pointer; font-size: 14px; }
  .fb button:disabled { cursor: default; opacity: .6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                  border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
                  font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--panel);
             border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 42px;
             max-height: 140px; }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send { border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent);
          color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  footer { padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>{{clinic_name}} Assistant</h1>
    <p>Answers come from the clinic's documents, with sources. Not medical advice.</p>
  </header>
  <div id="staffBar" class="staffbar" role="status" hidden></div>
  <div id="log" aria-live="polite">
    <div class="msg bot">Hi! Ask me about services, prices, hours, appointments, policies or aftercare.
      <div class="chips" id="chips">
        <button type="button">What are your Saturday hours?</button>
        <button type="button">How much does a root canal cost?</button>
        <button type="button">What is your cancellation policy?</button>
        <button type="button">I'd like to book a cleaning</button>
      </div>
    </div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question…"
              aria-label="Your message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <footer>Emergency? Call {{emergency}}. Reception: {{reception}}.</footer>
</div>
<script>
(() => {
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let threadId = null;
  try { threadId = sessionStorage.getItem("bsb-thread"); } catch (e) {}

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const scroll = () => { log.scrollTop = log.scrollHeight; };

  // "DENT-019#2-master-2026-service-tariff-table" -> "DENT-019 · Master 2026 service tariff table"
  const sourceLabel = (c) => {
    const [doc, slug] = c.split("#");
    if (!slug) return doc;
    const words = slug.replace(/^\d+-/, "").replace(/-\d+$/, "").replace(/-/g, " ");
    return `${doc} · ${words.charAt(0).toUpperCase()}${words.slice(1)}`;
  };

  // Number the cited documents in order: {"DENT-019" -> {n: 1, sections: [...]}}.
  const numberSources = (citations) => {
    const docs = new Map();
    [...new Set(citations || [])].forEach((c) => {
      const doc = c.split("#")[0];
      if (!docs.has(doc)) docs.set(doc, { n: docs.size + 1, sections: [] });
      const label = sourceLabel(c).split(" · ")[1];
      if (label && !docs.get(doc).sections.includes(label)) docs.get(doc).sections.push(label);
    });
    return docs;
  };

  // Replace inline "[DENT-002]" markers with superscript source numbers (text nodes only).
  const renderAnswer = (node, text, docs) => {
    node.textContent = "";
    const parts = text.split(/(\s*\[[A-Za-z0-9-]+\])/);
    parts.forEach((part) => {
      const m = part.match(/^\s*\[([A-Za-z0-9-]+)\]$/);
      if (m && docs.has(m[1])) {
        const sup = el("sup", null, docs.get(m[1]).n);
        sup.title = m[1];
        node.appendChild(sup);
      } else if (part) {
        node.appendChild(document.createTextNode(part));
      }
    });
  };

  // Numbered citations in the answer text plus a "Sources" list under it.
  const addSources = (bubble, body, raw, citations) => {
    const docs = numberSources(citations);
    if (!docs.size) return;
    renderAnswer(body, raw, docs);
    const meta = el("div", "meta", "Sources:");
    const ol = el("ol");
    docs.forEach((d, doc) => {
      ol.appendChild(el("li", null, d.sections.length ? `${doc} · ${d.sections.join("; ")}` : doc));
    });
    meta.appendChild(ol);
    bubble.appendChild(meta);
  };
  const addStaff = (text) => {
    const b = el("div", "msg bot staff");
    b.appendChild(el("div", "who", "Staff · {{clinic_name}}"));
    b.appendChild(document.createTextNode(text));
    log.appendChild(b);
  };
  const addNote = (text) => {
    const b = el("div", "msg bot");
    b.appendChild(el("div", "note", text));
    log.appendChild(b);
  };

  function finish(bubble, body, raw, done) {
    if (done.behavior === "staff") { // relayed to staff: no bot reply (the banner shows status)
      bubble.remove();
      watchStaff(done.thread_id, done.message_id || 0);
      return;
    }
    addSources(bubble, body, raw, done.citations);
    if (done.handoff_pending) {
      if (!staffTimer) // a new staff chat (not a red-flag answer during one)
        bubble.appendChild(el("div", "note", "Our staff has been notified and will reply here."));
      watchStaff(done.thread_id, done.message_id || 0);
    }
    if (done.message_id != null && done.thread_id) {
      const fb = el("div", "fb");
      fb.appendChild(el("span", "meta", "Helpful?"));
      [["👍", 1], ["👎", -1]].forEach(([label, rating]) => {
        const b = el("button", null, label);
        b.type = "button";
        b.setAttribute("aria-label", rating > 0 ? "Helpful" : "Not helpful");
        b.onclick = async () => {
          fb.querySelectorAll("button").forEach((x) => (x.disabled = true));
          try {
            await fetch("/v1/feedback", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ thread_id: done.thread_id, message_id: done.message_id, rating }),
            });
            fb.lastChild.after(el("span", "meta", "Thanks!"));
          } catch (e) { fb.lastChild.after(el("span", "meta", "Couldn't save feedback.")); }
        };
        fb.appendChild(b);
      });
      bubble.appendChild(fb);
    }
  }

  // While staff hold the conversation, check for their messages every 5 s (every 15 s while
  // the tab is hidden). These checks also tell the server the patient is still here.
  const bar = document.getElementById("staffBar");
  const showBar = (online) => {
    bar.hidden = false;
    bar.textContent = online === false
      ? "⚪ You're in a chat with {{clinic_name}} staff · nobody is online right now"
      : "🟢 You're chatting with {{clinic_name}} staff · they'll reply here";
  };
  let staffTimer = null, staffTid = null;
  function watchStaff(tid, after) {
    if (staffTimer && staffTid === tid) return; // already watching: keep the last seen id
    clearInterval(staffTimer);
    staffTid = tid;
    const until = Date.now() + 2 * 3600 * 1000;
    showBar();
    const stop = () => {
      clearInterval(staffTimer); staffTimer = null; staffTid = null; bar.hidden = true;
    };
    let tick = 0;
    const poll = async () => {
      if (Date.now() > until) { stop(); return; }
      const hidden = document.hidden;
      if (hidden && tick++ % 3) return;
      try {
        const r = await fetch(
          `/v1/chat/${encodeURIComponent(tid)}/staff-replies?after=${after}&hidden=${hidden}`);
        if (!r.ok) return;
        const data = await r.json();
        showBar(data.staff_online);
        data.replies.forEach((m) => {
          if (m.kind === "staff") addStaff(m.text);
          else addNote(m.text);
          after = Math.max(after, m.id);
          scroll();
        });
        if (!data.pending) stop();
      } catch (e) { /* try again on the next tick */ }
    };
    staffTimer = setInterval(poll, 5000);
    poll();
  }
  // A page opened on an existing conversation (refresh, duplicated tab) shows it so far and
  // rejoins an open staff chat.
  async function restore() {
    if (!threadId) return;
    let data;
    try {
      const r = await fetch(`/v1/chat/${encodeURIComponent(threadId)}/history`);
      if (!r.ok) return;
      data = await r.json();
    } catch (e) { return; }
    if (!data.messages.length) return;
    document.getElementById("chips")?.remove();
    let last = 0;
    data.messages.forEach((m) => {
      last = Math.max(last, m.id);
      if (m.role === "user") log.appendChild(el("div", "msg user", m.content));
      else if (m.role === "human_agent") addStaff(m.content);
      else if ((m.intent || "").startsWith("staff_")) addNote(m.content);
      else {
        const b = el("div", "msg bot");
        const body = el("span", null, m.content);
        b.appendChild(body);
        addSources(b, body, m.content, m.citations);
        log.appendChild(b);
      }
    });
    scroll();
    if (data.pending) watchStaff(threadId, last);
  }
  restore();

  // Duplicated tabs share one conversation (same thread id). They tell each other about new
  // messages and answers, so every tab shows them at once (same browser only, no server calls).
  let tabs = null;
  try { tabs = new BroadcastChannel("bsb-chat"); } catch (e) {}
  const tell = (msg) => {
    if (!tabs || !threadId) return;
    try { tabs.postMessage({ tid: threadId, ...msg }); } catch (e) {}
  };
  let remote = null; // the answer another tab is waiting for
  if (tabs) tabs.onmessage = ({ data: m }) => {
    if (!m || m.tid !== threadId) return;
    if (m.type === "user") {
      document.getElementById("chips")?.remove();
      log.appendChild(el("div", "msg user", m.text));
      const bubble = el("div", "msg bot");
      const body = el("span", "status", "Thinking…");
      bubble.appendChild(body);
      log.appendChild(bubble);
      remote = { bubble, body };
    } else if (m.type === "reply" && remote) {
      const { bubble, body } = remote;
      remote = null;
      body.className = "";
      body.textContent = m.raw;
      finish(bubble, body, m.raw, m.done);
    } else if (m.type === "error" && remote) {
      remote.body.textContent = "Sorry, something went wrong reaching the assistant.";
      remote = null;
    }
    scroll();
  };

  async function ask(text) {
    document.getElementById("chips")?.remove();
    log.appendChild(el("div", "msg user", text));
    tell({ type: "user", text });
    const bubble = el("div", "msg bot");
    const body = el("span", "status", "Thinking…");
    bubble.appendChild(body);
    log.appendChild(bubble);
    scroll();
    send.disabled = true;
    // Free hosting sleeps when idle: say so if the first byte is slow.
    const slow = setTimeout(() => {
      if (body.classList.contains("status"))
        body.textContent = "Waking the server up (free hosting) — this can take up to a minute…";
    }, 6000);

    let started = false, done = null, raw = "";
    try {
      const res = await fetch("/v1/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
        body: JSON.stringify({ message: text, thread_id: threadId }),
      });
      if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          let event = "message", data = "";
          block.split("\n").forEach((line) => {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          });
          if (!data) continue;
          const payload = JSON.parse(data);
          if (event === "answer") {
            if (!started) { started = true; body.className = ""; body.textContent = ""; }
            raw += (raw ? " " : "") + payload.text;
            body.textContent = raw;
            scroll();
          } else if (event === "done") {
            done = payload;
          }
        }
      }
      if (!started && !(done && done.behavior === "staff")) throw new Error("empty reply");
      if (done) {
        threadId = done.thread_id;
        try { sessionStorage.setItem("bsb-thread", threadId); } catch (e) {}
        finish(bubble, body, raw, done);
        tell({ type: "reply", raw, done });
      }
    } catch (e) {
      tell({ type: "error" });
      body.className = "status";
      body.textContent = "Sorry, something went wrong reaching the assistant. Please try again.";
    } finally {
      clearTimeout(slow);
      send.disabled = false;
      input.focus();
      scroll();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    input.style.height = "";
    ask(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "";
    input.style.height = `${input.scrollHeight}px`;
  });
  document.getElementById("chips").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && !send.disabled) ask(e.target.textContent);
  });
})();
</script>
</body>
</html>
