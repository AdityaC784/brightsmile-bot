kb_dir: data/kb
manifest: data/kb/manifest.json

chunking:
  # "heading" = split on document structure (MD/DOCX headings, PDF sections, one CSV row per chunk)
  # "fixed"   = fixed-size token windows with overlap (baseline for the chunking experiment)
  strategy: heading
  heading:
    max_tokens: 450
    min_tokens: 40
  fixed:
    size_tokens: 300
    overlap_tokens: 50

search:
  mode: hybrid          # hybrid | dense | lexical
  candidates_per_list: 50
  rrf_k: 60
  # Weighted RRF: the full-text list counts this much relative to the dense list.
  # Dev sweep 2026-11-13 (heading chunks, recall@5 / MRR): 1.0 -> 0.76/0.78, 0.5 -> 0.86/0.78,
  # 0.3 -> 0.88/0.79, 0.15 -> 0.90/0.80; dense-only 0.88/0.80. Exact-ID cases stay at rank 1
  # for every weight (dense alone ranks EQP-005 first for 'SRV-005A'). 0.3 chosen over 0.15 to
  # avoid over-fitting 21 dev cases while keeping full-text meaningful.
  lexical_weight: 0.3
  # One-hop reference expansion for answering (not used by the retrieval eval): when a retrieved
  # chunk names a row code (REF-03, PKG-002, PAY-06, ...) whose row chunk wasn't retrieved, add
  # up to this many such rows as extra sources (the KB cross-references itself this way, e.g. a
  # package row says "refund policy code: REF-03; REF-04").
  expand_references: 3
  top_k: 6

  # Archived documents (DENT-020, 2025 prices) stay indexed so the bot can explain
  # "that was last year's price", but are down-weighted and flagged in the prompt.
  # Multiplies the fused RRF score. RRF scores are compressed (~0.014-0.033 across the top 50),
  # so 0.5 buried DENT-020 at rank ~18 even for explicit "in 2025" questions. 0.85 is a starting
  # point; tune it with the retrieval eval once the golden set exists.
  archived_penalty: 0.85

abstention:
  # If the best fused score is below this, abstain before calling the generator.
  # Tuned via the threshold sweep experiment (docs/results.md).
  min_top_score: 0.0
