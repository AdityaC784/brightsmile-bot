# Every model ID lives here so swapping providers is a config change, not a code change.
# Provider model catalogs change often (Groq retired Llama 3.x in Aug 2026) —
# run `python -m bot.llm.check_models` after adding keys to verify these IDs are live.

roles:
  # Writes the grounded, cited answer the patient sees.
  # Qwen chosen over openai/gpt-oss-120b (2026-11-13 side-by-side on a cited-answer prompt):
  # gpt-oss emitted 【】 instead of [] citations and U+2011 non-breaking hyphens inside IDs
  # (SRV‑005A), which would break exact-ID citation checks; Qwen followed the format and was faster.
  # Uses its own Groq key (GROQ_GENERATOR_API_KEY) if set, else falls back to GROQ_API_KEY.
  generator:
    provider: groq
    model: qwen/qwen3.8-27b
    api_key_setting: groq_generator_api_key
    max_tokens: 1024
    temperature: 0

  # Cheap/fast utility calls: intent classification, follow-up question rewriting, slot extraction.
  # gpt-oss is a reasoning model: hidden reasoning tokens count toward max_tokens, so keep
  # reasoning_effort low and leave headroom (verifier replies list one result per claim).
  utility:
    provider: groq
    model: openai/gpt-oss-20b
    max_tokens: 1024
    temperature: 0
    reasoning_effort: low

  # Eval judge — deliberately a different model family than the generator (Qwen), to reduce
  # self-preference bias. Temperature 0. Chosen by validation against hand labels (2026-11-13,
  # `make judge-score`): gemini-3.5-flash-lite kappa 0.36 (passed replies with factual errors);
  # gpt-oss-120b kappa 0.58. gemini-3.6-flash is unusable on the free tier (20 requests/day).
  # Note: the citation verifier (utility) is also gpt-oss family. Uses GROQ_API_KEY, a different
  # org from the generator key, so judge and generator rate limits don't collide.
  judge:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 4096
    temperature: 0
    reasoning_effort: medium

embeddings:
  provider: gemini
  model: gemini-embedding-001
  # Matryoshka-truncated to 768 dims: pgvector HNSW indexes cap at 2000 dims,
  # and 768 keeps storage small. Truncated vectors are L2-normalised before storing.
  dimensions: 768
  batch_size: 50
