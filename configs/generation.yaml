# Answer generation, abstention and citation verification (read by src/bot/rag/).

# Facts the bot may always use for hand-offs. Copied verbatim from the KB
# (DENT-001 institutional table, DENT-006 booking channels, DENT-035 emergency directory).
clinic:
  name: BrightSmile Dental Care
  reception: "+91-20-5550-0140 (phone & WhatsApp, Mon–Sat 09:30 AM – 08:30 PM IST)"
  booking_url: https://brightsmile.example/book
  after_hours_triage: "+91-20-5550-0199"
  emergency: "112 / 108, or Jupiter Hospital Baner / Manipal Hospital Baner"

# Shown when the bot can't stand behind an answer (low retrieval score or failed verification).
fallback_answer: >-
  I'm not able to confirm that from BrightSmile Dental Care's official information, so I don't
  want to guess. Our reception team can help: call or WhatsApp +91-20-5550-0140
  (Mon–Sat, 09:30 AM – 08:30 PM IST) or book at https://brightsmile.example/book.

# Fallback for emergency (handoff) replies that fail verification: never downgrade an emergency
# to "call reception during office hours". Facts from DENT-035 §5 / DENT-002 §6 / DENT-036 §3.
emergency_fallback_answer: >-
  This may be an emergency. If you have rapidly spreading facial or neck swelling, difficulty
  breathing or swallowing, a fever above 101°F with swelling, or dizziness or fainting, call 112
  (or 108 for an ambulance) or go straight to Jupiter Hospital, Baner or Manipal Hospital, Baner.
  For bleeding that hasn't stopped after 45 minutes of firm gauze pressure, call BrightSmile
  Dental Care on +91-20-5550-0140 (Mon–Sat, 09:30 AM – 08:30 PM) or the after-hours triage line
  +91-20-5550-0199 (08:30 PM – 10:30 PM Mon–Sat, 10:00 AM – 06:00 PM Sun).
  For a knocked-out adult tooth, every minute counts (30–60 minutes): hold it by the crown only,
  never the root; if dirty, rinse for at most 10 seconds in cold milk or saline; if you are an
  alert adult, gently put it back in the socket and bite on a clean cloth, otherwise keep it in
  cold milk or saline (never dry or in tap water). Then come straight to BrightSmile Dental Care
  (Mon–Sat, 09:30 AM – 08:30 PM, calling +91-20-5550-0140 on the way) or, on Sundays and after
  hours, go to a hospital dental emergency department.

lead:
  # Shown before any personal details are taken; stored with the lead as the consent record.
  consent_text: >-
    Would you like our team to contact you about this? If yes, please reply with your name and a
    phone number or email. We'll use them only to follow up on this enquiry, never share or sell
    them, and you can ask us to delete them at any time.

verification:
  # Experiment switch (plan §7: with vs without citation verification).
  enabled: true
  # Fraction of cited claims that must be supported; below this the answer is replaced by the
  # fallback. 1.0 = any unsupported claim triggers the fallback.
  min_support_ratio: 1.0
  # When verification fails, give the generator this many retries with the verifier's reasons
  # (e.g. "₹9,500 not in cited source", "drops the condition 'with an authorised adult'") before
  # falling back. Costs one extra generator call, only for replies that failed.
  repair_attempts: 1
