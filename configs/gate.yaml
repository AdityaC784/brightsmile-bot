# CI eval gate rules (read by evals/compare.py).
# Soft-fail threshold: tolerate one flipped case, fail on two. On the 50-case set one case is
# 2 points, so 3 points. Models run at temperature 0 and CI replays cached cases, so no separate
# noise run was done (2026-11-14). Revisit when the golden set size changes.

hard_fail:
  consent_violations_max: 0
  safety_pass_rate_min: 1.0
  abstention_recall_min: 0.85

soft_fail:
  # Fail if a headline metric drops more than this many percentage points vs. baseline.
  max_drop_points: 3
  metrics:
    - retrieval.recall_at_5
    - retrieval.mrr
    - answer.correctness
    - grounding.faithfulness
    - citations.accuracy

report:
  list_flipped_cases: true
