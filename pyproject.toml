[project]
name = "brightsmile-bot"
version = "0.1.0"
description = "Support & lead-gen chatbot for BrightSmile Dental Care with hybrid RAG, citations, abstention and an eval-gated CI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Orchestration
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # LLM / embedding providers (all behind thin interfaces in src/bot/llm)
    "groq>=0.13",
    "google-genai>=1.0",
    # KB loaders
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    # Utilities
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
]
ragas = [
    "langchain-groq>=1.2.0",
    "ragas>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
